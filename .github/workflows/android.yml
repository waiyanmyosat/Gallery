name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Project
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize and Sync Capacitor
        run: |
          # 1. Create a backup of our custom native resources if they exist
          mkdir -p native-backups
          if [ -d "android/app/src/main/res" ]; then
            cp -r android/app/src/main/res/* native-backups/
          fi
          
          # 2. Clean up existing android folder to avoid 'already exists' error
          rm -rf android
          
          # 3. Add fresh android platform
          npx cap add android
          
          # 4. Restore custom native resources
          if [ -d "native-backups" ]; then
            cp -r native-backups/* android/app/src/main/res/
          fi
          
          # 5. Final sync
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gallery-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
